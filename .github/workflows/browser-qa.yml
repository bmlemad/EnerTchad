name: QA navigateur — production
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Playwright
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Exécuter les tests
        run: |
          mkdir -p artifacts
          npx --yes playwright@1.55.0 test qa/site.spec.js --reporter=line
      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-browser
          path: artifacts/
          if-no-files-found: ignore
