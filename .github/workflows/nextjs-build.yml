name: Next.js — build and migration contract
on:
  push:
    branches: [main, migration/nextjs-netlify]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: node --test scripts/next/prepare.test.mjs
      - run: npm ci
      - run: node --test scripts/next/subsites.test.mjs
      - run: node --test scripts/test_page_share.mjs
      - run: node --test scripts/test_navigation_review.mjs
      - run: node --test scripts/test_qualified_enquiries.mjs
      - run: node --test scripts/test_business_journeys.mjs
      - run: python3 scripts/test_capability_labels.py
      - run: node --test scripts/test_main_nav.mjs
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Check audited bilingual journeys
        run: python3 scripts/test_site_audit.py
      - run: npm run check:migration
      - name: Check that every critical CSS set is still applied
        run: python3 scripts/test_critical_applied.py
      - name: Check that repeated figures agree across surfaces (lot 98)
        run: python3 scripts/test_figures_consistency.py
      - name: Check that the single glass rule leads every page (lot 90)
        run: python3 scripts/test_glass_chrome.py
      - uses: actions/upload-artifact@v7
        with:
          name: enertchad-netlify-export
          path: out/
          include-hidden-files: true
          if-no-files-found: error
