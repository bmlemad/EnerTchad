name: OVH — corporate readiness deployment

on:
  push:
    branches: [main, improve/mobile-quick-navigation-20261014, fix/share-footer-contrast-20261015, improve/liquid-glass-20261015, fix/navigation-accessibility-20261016, improve/engineering-offer-20261016, improve/industrial-modernisation-20261016, fix/configurator-history-20261016]
  workflow_dispatch:

concurrency:
  group: ovh-corporate-readiness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check preparation and public asset boundaries
        run: node --test scripts/next/prepare.test.mjs
      - name: Check public document metadata regressions
        run: python3 scripts/test_document_metadata.py
      - name: Check investor enquiry journeys
        run: python3 scripts/test_investor_journeys.py
      - name: Check footer sharing and theme contrast
        run: node --test scripts/test_page_share.mjs
      - name: Check contact request recovery
        run: node --test scripts/test_contact_delivery.mjs
      - name: Check contact language context
        run: node --test scripts/test_contact_profiles.mjs
      - name: Check search navigation regressions
        run: python3 scripts/test_search_navigation.py
      - name: Check formation-stage company descriptions
        run: python3 scripts/test_company_descriptions.py
      - name: Check engineering navigation language switches
        run: python3 scripts/test_engineering_offer.py
      - name: Check modern navigation, service context and filters
        run: |
          python3 scripts/test_modernisation.py
          node --test scripts/test_modernisation_ui.cjs
      - name: Check configurator history navigation
        run: |
          node --test scripts/test_configurator_history.cjs
          python3 scripts/test_configurator_history.py
      - name: Check direct enquiry-form access
        run: python3 scripts/test_direct_enquiry_form.py
      - name: Check Arabic readiness
        run: python3 scripts/test_arabic_readiness.py
      - name: Check narrow mobile navigation
        run: python3 scripts/test_mobile_quick_nav.py
      - name: Check search focus, selection and background restoration
        run: node --test scripts/test_search_accessibility.mjs
      - run: npm ci
      - name: Preserve baseline for the performance check
        run: |
          git worktree add --detach ../readiness-baseline HEAD^
          python3 scripts/bench/static_budget.py --root ../readiness-baseline --out /tmp/readiness-baseline.json
      - name: Build reviewed pages
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run check:migration
      - name: Validate exported direct enquiry access
        run: python3 scripts/audit_enquiry_access.py
      - name: Validate Arabic readiness
        run: python3 scripts/audit_arabic_readiness.py
      - name: Validate exported company descriptions
        run: python3 scripts/audit_company_descriptions.py
      - name: Validate delivered mobile quick navigation
        run: python3 scripts/audit_mobile_quick_nav.py
      - name: Validate industrial modernisation
        run: python3 scripts/audit_modernisation.py
      - name: Validate verified document dates
        run: python3 scripts/audit_document_dates.py
      - name: Validate English download language disclosures
        run: python3 scripts/audit_download_languages.py
      - name: Validate every indexed search destination
        run: python3 scripts/audit_search_navigation.py --root out --redirects _redirects
      - name: Validate public navigation and keyboard bypass links
        run: python3 scripts/audit_public_navigation.py
      - name: Check content, routes and language pairs
        run: |
          python3 scripts/check_integrity.py
          python3 scripts/audit_redirects.py
          python3 scripts/audit_i18n_pairs.py
          python3 scripts/audit_conversion.py
      - name: Check the performance budget
        run: |
          python3 scripts/bench/static_budget.py --root . --out /tmp/readiness-current.json
          python3 scripts/bench/static_budget.py --compare /tmp/readiness-baseline.json /tmp/readiness-current.json --md /tmp/readiness-budget.md
      - name: Package for OVH Apache
        run: python3 scripts/ovh/package.py --output /tmp/EnerTchad-OVH.zip
      - name: Publish verified static files to the existing hosting branch
        run: |
          git fetch origin ovh-static
          git worktree add --detach ../readiness-deploy origin/ovh-static
          rsync -a --delete --exclude=.git --exclude=_headers --exclude=_redirects --exclude=CNAME out/ ../readiness-deploy/
          git -C ../readiness-deploy add --all
          if git -C ../readiness-deploy diff --cached --quiet; then
            echo "Static hosting branch already matches this export."
          else
            git -C ../readiness-deploy -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "OVH: reviewed corporate readiness export from $GITHUB_SHA"
            git -C ../readiness-deploy push origin HEAD:ovh-static
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: enertchad-corporate-readiness-ovh
          path: |
            /tmp/EnerTchad-OVH.zip
            /tmp/readiness-budget.md
          if-no-files-found: error
