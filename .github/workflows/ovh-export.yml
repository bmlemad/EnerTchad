name: OVH — Apache export
on:
  pull_request:
    paths:
      - 'scripts/ovh/**'
      - 'docs/migration-ovh.md'
      - '.github/workflows/ovh-export.yml'
  workflow_dispatch:
  push:
    branches: ['migration/ovh-git-20261009']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run check:migration
      - run: python3 scripts/ovh/package.py --output /tmp/EnerTchad-OVH.zip
      - run: sudo apt-get update -qq
      - run: sudo apt-get install -y --no-install-recommends apache2-bin
      - run: python3 scripts/ovh/check_apache.py
      - uses: actions/upload-artifact@v7
        with:
          name: enertchad-ovh-export
          path: /tmp/EnerTchad-OVH.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/migration/ovh-git-20261009'
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ovh-static-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: published
      - uses: actions/download-artifact@v7
        with:
          name: enertchad-ovh-export
          path: package
      - name: Publish tested Apache export
        working-directory: published
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if git ls-remote --exit-code --heads origin ovh-static >/dev/null 2>&1; then
            git fetch --depth=1 origin ovh-static
            git checkout -B ovh-static FETCH_HEAD
          else
            git checkout --orphan ovh-static
          fi
          git rm -rf --ignore-unmatch .
          unzip -q ../package/EnerTchad-OVH.zip -d .
          test -s index.html
          test -s .htaccess
          test -d _next
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish tested OVH export from $SOURCE_SHA"
          git push origin HEAD:refs/heads/ovh-static
