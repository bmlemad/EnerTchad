name: Intégrité du site
on:
  push: {branches: [main]}
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/check_integrity.py
      - name: Générer la cartographie d’architecture
        run: python scripts/audit_architecture.py
      - name: Auditer UI, accessibilité et SEO technique
        run: python scripts/audit_ui.py
      - name: Auditer CSS / JS
        run: python scripts/audit_assets.py
      - name: Auditer les garde-fous de performance
        run: python scripts/audit_performance.py
      - name: Publier l’audit assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-audit-2026
          path: reports/assets-audit-2026.md
          if-no-files-found: error
      - name: Publier l’audit performance
        uses: actions/upload-artifact@v4
        with:
          name: performance-audit-2026
          path: reports/performance-audit-2026.md
          if-no-files-found: error
      - name: Publier l’audit UI
        uses: actions/upload-artifact@v4
        with:
          name: ui-accessibility-seo-audit
          path: reports/ui-audit-2026.md
      - name: Publier la cartographie
        uses: actions/upload-artifact@v4
        with:
          name: site-architecture-audit
          path: reports/site-architecture-2026.md
