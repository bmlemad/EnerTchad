[build]
  publish = "."

[build.processing]
  skip_processing = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/pole-amont"
  to = "/amont/"
  status = 301

[[redirects]]
  from = "/pole-amont.html"
  to = "/amont/"
  status = 301

[[redirects]]
  from = "/pole-amont-activites"
  to = "/amont/activites"
  status = 301

[[redirects]]
  from = "/pole-amont-eor"
  to = "/amont/eor"
  status = 301

[[redirects]]
  from = "/pole-amont-services-ep"
  to = "/amont/services-ep"
  status = 301

[[redirects]]
  from = "/pole-intermediaire"
  to = "/intermediaire/"
  status = 301

[[redirects]]
  from = "/pole-intermediaire-logistique"
  to = "/intermediaire/logistique"
  status = 301

[[redirects]]
  from = "/pole-intermediaire-services"
  to = "/intermediaire/services"
  status = 301

[[redirects]]
  from = "/pole-intermediaire-sites"
  to = "/intermediaire/sites"
  status = 301

[[redirects]]
  from = "/pole-aval"
  to = "/aval/"
  status = 301

[[redirects]]
  from = "/reporting"
  to = "/publications"
  status = 301

[[redirects]]
  from = "/reporting-en"
  to = "/publications-en"
  status = 301
