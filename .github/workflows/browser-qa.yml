name: QA navigateur — production
on:
  # Une PR ne lance que les contrôles ciblés, sur l'export construit et servi dans le runner
  # (scripts/bench/serve.mjs) : plus de prévisualisation Netlify (site supprimé, décision du DG).
  pull_request:
    paths:
      - 'qa/**'
      - '.github/workflows/browser-qa.yml'
      - 'assets/chrome/u2_75a2c4383ddf.js'
      - 'assets/chrome/hub-aval-base.css'
      - 'aval/index.html'
      - 'tchaditech/index.html'
      - 'scripts/next/subsites.mjs'
      - 'assets/chrome/subsites.css'
  # Hebdomadaire et a la demande : lancee a chaque envoi, cette QA (toutes les pages,
  # plusieurs passages) a depasse a elle seule les requetes incluses de l hebergeur.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      test_grep:
        description: 'Filtrer les tests par leur titre (vide = suite complète)'
        required: false
        default: ''
      site_url:
        description: 'Adresse à vérifier (production par défaut)'
        required: false
        default: 'https://enertchad.com/'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8790/' || inputs.site_url || 'https://enertchad.com/' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Construire et servir l'export de la PR
        if: github.event_name == 'pull_request'
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm run build
          nohup node scripts/bench/serve.mjs out 8790 > /tmp/serve.log 2>&1 &
          for i in {1..30}; do curl -s -o /dev/null http://127.0.0.1:8790/ && exit 0; sleep 1; done
          cat /tmp/serve.log; exit 1
      - name: Installer Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright@1.55.0 install --with-deps chromium
      - name: Attendre le déploiement de production
        if: github.event_name != 'pull_request'
        run: |
          for i in {1..60}; do
            code=$(curl -L -s -o /tmp/site.html -w '%{http_code}' "$SITE_URL/")
            if [ "$code" = "200" ] && grep -q 'EnerTchad' /tmp/site.html; then exit 0; fi
            sleep 5
          done
          echo "Le déploiement de production n'est pas encore disponible"; exit 1
      - name: Vérifier les garde-fous de synchronisation production
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          page=$(curl -L -sS "$SITE_URL/petrochimie/")
          case "$page" in
            *'class="et-skip"'*|*'class="skip-link"'*) ;;
            *) echo "::warning::Production ne contient pas le skip-link source attendu sur /petrochimie/. Vérifier la synchronisation du deploiement de production avant d'interpréter la QA comme un défaut du dépôt." ;;
          esac
          case "$page" in
            *'main-content'*) ;;
            *) echo "::warning::Production ne contient pas #main-content sur /petrochimie/. Le dépôt Git doit être comparé au déploiement réellement servi." ;;
          esac

      - name: Exécuter la QA fonctionnelle
        env:
          TEST_GREP: ${{ github.event_name == 'pull_request' && 'dedicated spaces —|CTA vocabulary — core actions|CTA vocabulary — editorial|internationalization — language|navigation — representative pages contain|performance — critical pages|trust center|forms, anchors and interactive|mobile interactions|external scripts remain|images have alt text|controls are explicitly labelled|obvious cache-busting|disclosure controls keep|resource integrity|visual system budgets|localized pages declare|useful alternative text|canonical, title and primary|strategic SVGs|critical local resources use|consolidated tokens|legacy glass markers remain' || inputs.test_grep }}
        run: |
          mkdir -p artifacts
          if [ -n "$TEST_GREP" ]; then
            npx --yes playwright@1.55.0 test qa --grep "$TEST_GREP" --reporter=line
          else
            npx --yes playwright@1.55.0 test qa --reporter=line
          fi
      # La suite qa inclut déjà full-site-visual.spec.js ; ne pas le lancer deux fois.
      - name: Publier les captures et rapports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-browser
          path: artifacts/
          if-no-files-found: ignore
