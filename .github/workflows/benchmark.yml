name: Benchmark performance réel

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '41 3 * * 1'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer le benchmark statique
        run: |
          python scripts/benchmark_site.py
          cat reports/benchmark-site-2026.md
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Installer Lighthouse
        run: npm install --no-save --no-package-lock lighthouse@13
      - name: Attendre la production
        run: |
          python - <<'PY'
          import time, urllib.request
          url = "https://enertchad-delta.vercel.app/"
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=10) as r:
                      if r.status < 500:
                          print("Production disponible:", r.status)
                          break
              except Exception as e:
                  print("Attente:", e)
              time.sleep(10)
          else:
              raise SystemExit("Production indisponible")
          PY
      - name: Mesurer les parcours critiques
        run: |
          mkdir -p reports/lighthouse
          run_lighthouse() {
            local url="$1"
            local mode="$2"
            local output="$3"
            local attempt
            for attempt in 1 2 3; do
              echo "Lighthouse $mode $url — tentative $attempt/3"
              if [ "$mode" = "desktop" ]; then
                npx lighthouse "$url" --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --preset=desktop --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="$output" && return 0
              else
                npx lighthouse "$url" --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --preset=perf --form-factor=mobile --screenEmulation.mobile=true --screenEmulation.width=412 --screenEmulation.height=915 --screenEmulation.deviceScaleFactor=2 --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="$output" && return 0
              fi
              rm -f "$output"
              sleep 4
            done
            return 1
          }
          for preset in mobile desktop; do
            for path in "/" "/index-en" "/ar" "/amont/" "/intermediaire/" "/aval/" "/petrochimie/" "/investisseurs/" "/contact/" "/faq/"; do
              name=$(printf '%s' "$path" | tr '/-' '__' | sed 's/^_*$//')
              [ -n "$name" ] || name="home"
              run_lighthouse "https://enertchad-delta.vercel.app$path" "$preset" "reports/lighthouse/"$preset"_"$name".json"
            done
          done
      - name: Résumer les mesures Lighthouse
        run: python scripts/summarize_lighthouse.py
      - name: Signaler les hotspots mobile
        run: |
          python - <<'PY'
          import glob, json
          for path in sorted(glob.glob("reports/lighthouse/mobile_*.json")):
              with open(path, encoding="utf-8") as f:
                  d=json.load(f)
              p=(d.get("categories",{}).get("performance",{}).get("score") or 0)*100
              a=d.get("audits",{})
              tbt=(a.get("total-blocking-time",{}).get("numericValue") or 0)
              lcp=(a.get("largest-contentful-paint",{}).get("numericValue") or 0)
              if p < 75 or tbt > 800 or lcp > 2500:
                  print(f"::warning file={path}::Mobile hotspot: performance={p:.0f}, TBT={tbt:.0f}ms, LCP={lcp:.0f}ms")
              else:
                  print(f"OK {path}: performance={p:.0f}, TBT={tbt:.0f}ms, LCP={lcp:.0f}ms")
          PY
      - name: Publier les rapports
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-performance-2026
          path: |
            reports/benchmark-site-2026.md
            reports/lighthouse/*.json
            reports/lighthouse-summary-2026.md
          if-no-files-found: error
