name: Next.js — build and migration contract
on:
  push:
    branches: [main, migration/nextjs-netlify]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run check:migration
      - uses: actions/upload-artifact@v7
        with:
          name: enertchad-netlify-export
          path: out/
          include-hidden-files: true
          if-no-files-found: error
